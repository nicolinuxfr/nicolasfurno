{{ define "main" }}
    <main>
      <h1>{{ .Site.Title }}</h1>
      <div class="homepage-content">
        <!-- Note that the content for index.html, as a sort of list page, will pull from content/_index.md -->
        {{.Content}}
      </div>
      <div class="articles">
        {{ range $index, $page := (.Paginate  (where .Site.RegularPages "Type" "ne" "pages") ).Pages }}
        <section class="item">
            <a href='{{ $page.RelPermalink }}'>
              {{ partial "image-list.html" (dict "page" $page "eager" (eq $index 0)) }}
            </a>
        </section>
        {{ end }}
      </div>
      
        {{ template "_internal/pagination.html" . }}
    </main>
{{ end }}
