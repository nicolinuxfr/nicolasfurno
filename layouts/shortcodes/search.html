<div class="recherche">
    <form id="search" role="search" onsubmit="return false">
        <label class="visually-hidden" for="search-input">Rechercher sur le blog</label>
        <input id="search-input" type="search" placeholder="Chercher" aria-controls="search-results" autocomplete="off" spellcheck="false" autofocus>
        <ul id="search-results" aria-label="Résultats de recherche"></ul>
    </form>
</div>

<script type="module">
    import * as pagefind from "/pagefind/pagefind.js";

    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");
    const searchTerm = new URL(document.location).searchParams.get("s");
    let searchNumber = 0;

    if (searchTerm) {
        searchInput.value = searchTerm;
    }

    async function searchExec(term) {
        const currentSearch = ++searchNumber;
        searchResults.replaceChildren();

        if (!term) return;

        const results = await pagefind.search(term);
        if (currentSearch !== searchNumber) return;

        const items = await Promise.all(results.results.map(async (result) => {
            const data = await result.data();
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = data.url;
            link.textContent = data.meta.title;
            item.append(link);
            return item;
        }));

        if (currentSearch === searchNumber) {
            searchResults.replaceChildren(...items);
        }
    }

    if (searchTerm) {
        searchExec(searchTerm);
    }

    searchInput.addEventListener("input", () => searchExec(searchInput.value));

    // Safari emits `search` when the built-in clear button is used.
    searchInput.addEventListener("search", () => searchExec(searchInput.value));

    searchInput.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
        const links = [...searchResults.querySelectorAll("a")];
        if (!links.length) return;
        event.preventDefault();
        (event.key === "ArrowDown" ? links[0] : links.at(-1)).focus();
    });

    searchResults.addEventListener("keydown", (event) => {
        if (!["ArrowDown", "ArrowUp", "Escape"].includes(event.key)) return;
        const links = [...searchResults.querySelectorAll("a")];
        const currentIndex = links.indexOf(document.activeElement);
        if (currentIndex === -1) return;
        event.preventDefault();

        if (event.key === "Escape" || (event.key === "ArrowUp" && currentIndex === 0)) {
            searchInput.focus();
            return;
        }

        const nextIndex = event.key === "ArrowDown"
            ? Math.min(currentIndex + 1, links.length - 1)
            : currentIndex - 1;
        links[nextIndex].focus();
    });

    searchInput.focus();
</script>
