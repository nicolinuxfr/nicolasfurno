<script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js"></script>

<style>
#map {
    width: 100%;
    height: 600px;
}
</style>

<div id="map"></div>

{{ $token := getenv "HUGO_MAPKIT" }}

<script>
    const tokenID = {{ $token | jsonify | safeJS }};
    const coordonnees = {{ . | jsonify | safeJS }};

    mapkit.init({
        authorizationCallback: function(done) {
            done(tokenID);
        },
        language:"fr",
        mapType: "Hybrid"
    });

    const map = new mapkit.Map("map", {
        mapType: mapkit.Map.MapTypes.Hybrid
    });

    const annotations = coordonnees.map((location) => {
        const coordinate = new mapkit.Coordinate(location.lat, location.long);
        const pinOptions = {
            glyphImage: { 1: "/img/pin.png", 2: "/img/pin@2x.png" },
            selectedGlyphImage: { 1: "/img/icon-192.png", 2: "/img/icon-512.png"},
            color: "#487b00"
        };
        return new mapkit.MarkerAnnotation(coordinate, pinOptions);
    });

    map.showItems(annotations, {
        padding: new mapkit.Padding(48, 48, 48, 48)
    });
</script>
