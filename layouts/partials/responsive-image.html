{{- $image := .image -}}
{{- $loading := default "lazy" .loading -}}
{{- $sources := partial "responsive-image-sources.html" . -}}

<img{{ with .transitionName }} style="--vt-name: img-{{ . }};"{{ end }}
    src="{{ $sources.src }}"
    srcset="{{ $sources.srcset }}"
    sizes="{{ .sizes }}"
    alt="{{ .alt }}"
    loading="{{ $loading }}"
    {{- if eq $loading "eager" }} fetchpriority="high"{{ end }}
    width="{{ $image.Width }}"
    height="{{ $image.Height }}"
>
